<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="English Practice - 30 minutos de prática diária com IA">
    <title>English Practice - 30min Daily</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --dark: #1F2937;
            --light: #F9FAFB;
            --border: #E5E7EB;
            --text-muted: #6B7280;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 16px;
            color: var(--dark);
            overflow-x: hidden;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 600px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #7C3AED 100%);
            color: white;
            padding: 28px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.9;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            min-width: 140px;
            text-align: center;
            letter-spacing: 2px;
        }

        .timer.warning {
            animation: pulse 1s infinite;
            color: #FCD34D;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .header-right {
            text-align: right;
            min-width: 120px;
        }

        .header-right p {
            margin: 6px 0;
            font-size: 13px;
            opacity: 0.95;
        }

        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .difficulty-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .difficulty-dot.off {
            background: rgba(255,255,255,0.3);
        }

        .difficulty-dot.active {
            background: white;
            box-shadow: 0 0 8px white;
        }

        .main-content {
            padding: 32px;
            flex: 1;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--light) 0%, white 100%);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            border: 1.5px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .stat-card.success {
            border-color: var(--success);
            background: linear-gradient(135deg, #ECFDF5 0%, white 100%);
        }

        .stat-card.danger {
            border-color: var(--danger);
            background: linear-gradient(135deg, #FEF2F2 0%, white 100%);
        }

        .stat-card.warning {
            border-color: var(--warning);
            background: linear-gradient(135deg, #FFFBEB 0%, white 100%);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .stat-card.success .stat-value { color: var(--success); }
        .stat-card.danger .stat-value { color: var(--danger); }
        .stat-card.warning .stat-value { color: var(--warning); }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .exercise-box {
            background: white;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            padding: 28px;
            margin-bottom: 24px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .exercise-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .exercise-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .exercise-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--dark);
            flex: 1;
            line-height: 1.4;
        }

        .audio-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            background: white;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .audio-btn.playing {
            animation: audioPlay 0.6s;
        }

        @keyframes audioPlay {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .question-text {
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 24px;
            line-height: 1.6;
            font-style: italic;
            padding: 16px;
            background: var(--light);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            text-align: left;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            color: var(--dark);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: linear-gradient(135deg, #F0F4FF 0%, #E0E7FF 100%);
            transform: translateX(4px);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
            color: var(--success);
            font-weight: 600;
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background: linear-gradient(135deg, #FEF2F2 0%, #FECACA 100%);
            color: var(--danger);
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-field:disabled {
            background: var(--light);
            cursor: not-allowed;
        }

        .feedback {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: none;
            animation: slideDown 0.3s ease-out;
            border-left: 4px solid;
            font-weight: 500;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.show {
            display: block;
        }

        .feedback.success {
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
            color: #065F46;
            border-left-color: var(--success);
        }

        .feedback.error {
            background: linear-gradient(135deg, #FEF2F2 0%, #FECACA 100%);
            color: #7F1D1D;
            border-left-color: var(--danger);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .session-end {
            text-align: center;
            padding: 40px 20px;
        }

        .session-end h2 {
            color: var(--dark);
            margin: 20px 0;
            font-size: 28px;
        }

        .session-end p {
            color: var(--text-muted);
            margin: 10px 0;
        }

        .final-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FCD34D 0%, #FBBF24 100%);
            color: #78350F;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            margin: 16px 0;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(252, 211, 77, 0.3);
        }

        .streak-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 24px 0;
            flex-wrap: wrap;
        }

        .streak-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--light);
            transition: all 0.3s ease;
        }

        .streak-dot.active {
            background: linear-gradient(135deg, #FCD34D 0%, #FBBF24 100%);
            box-shadow: 0 0 12px rgba(252, 211, 77, 0.6);
            transform: scale(1.2);
        }

        .error-message {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
                padding: 20px;
            }

            .header-left h1 {
                font-size: 22px;
            }

            .timer {
                font-size: 40px;
            }

            .main-content {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 20px;
            }

            .exercise-box {
                padding: 20px;
            }

            .audio-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 12px;
            }

            .header {
                padding: 16px;
            }

            .header-left h1 {
                font-size: 20px;
            }

            .timer {
                font-size: 36px;
                min-width: 100px;
            }

            .main-content {
                padding: 16px;
            }

            .exercise-box {
                padding: 16px;
                margin-bottom: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stat-value {
                font-size: 24px;
            }

            .stat-label {
                font-size: 11px;
            }
        }

        /* Scrollbar */
        .main-content::-webkit-scrollbar {
            width: 8px;
        }

        .main-content::-webkit-scrollbar-track {
            background: var(--light);
        }

        .main-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .main-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🎯 English Practice</h1>
                <p>Prática diária de inglês</p>
            </div>
            <div class="timer" id="timer">30:00</div>
            <div class="header-right">
                <p id="exerciseCount">Ex. 0/0</p>
                <div class="difficulty-badge" id="difficultyBadge">
                    <span id="difficultyLabel">Fácil</span>
                    <div class="difficulty-dot off" id="d1"></div>
                    <div class="difficulty-dot off" id="d2"></div>
                    <div class="difficulty-dot off" id="d3"></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-card success">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">Corretas</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-value" id="incorrectCount">0</div>
                    <div class="stat-label">Erradas</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-value" id="pointsCount">0</div>
                    <div class="stat-label">Pontos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="accuracyCount">0%</div>
                    <div class="stat-label">Acurácia</div>
                </div>
            </div>

            <div id="exerciseContent"></div>

            <div id="sessionEndContainer" style="display: none;">
                <div class="session-end">
                    <h2>🎉 Parabéns!</h2>
                    <p>Completaste a sessão de 30 minutos!</p>
                    <div class="final-badge" id="finalBadge">+0 pontos</div>
                    <p id="finalStats"></p>
                    <div class="streak-container" id="streakBar"></div>
                    <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 20px; max-width: 200px; margin-left: auto; margin-right: auto;">Recomeçar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== VOCABULÁRIO ESTRUTURADO POR DIFICULDADE =====
        const vocabularyData = {
            easy: {
                vocab: [
                    { en: "network", pt: "rede" },
                    { en: "computer", pt: "computador" },
                    { en: "server", pt: "servidor" },
                    { en: "password", pt: "palavra-passe" },
                    { en: "file", pt: "ficheiro" },
                    { en: "user", pt: "utilizador" },
                    { en: "system", pt: "sistema" },
                    { en: "connection", pt: "conexão" },
                    { en: "start", pt: "iniciar" },
                    { en: "stop", pt: "parar" }
                ],
                phrases: [
                    { en: "What is your name?", pt: "Qual é o teu nome?" },
                    { en: "Can you help me?", pt: "Podes ajudar-me?" },
                    { en: "How are you?", pt: "Como estás?" },
                    { en: "Good morning.", pt: "Bom dia." },
                    { en: "See you later.", pt: "Até mais tarde." },
                    { en: "Thank you very much.", pt: "Obrigado muito." },
                    { en: "Do you speak English?", pt: "Fala inglês?" },
                    { en: "I don't understand.", pt: "Não entendo." }
                ]
            },
            medium: {
                vocab: [
                    { en: "bandwidth", pt: "largura de banda" },
                    { en: "latency", pt: "latência" },
                    { en: "firewall", pt: "firewall" },
                    { en: "gateway", pt: "gateway" },
                    { en: "router", pt: "encaminhador" },
                    { en: "protocol", pt: "protocolo" },
                    { en: "encryption", pt: "encriptação" },
                    { en: "authentication", pt: "autenticação" },
                    { en: "database", pt: "banco de dados" },
                    { en: "configuration", pt: "configuração" }
                ],
                phrases: [
                    { en: "Configure the network interface properly.", pt: "Configure a interface de rede adequadamente." },
                    { en: "Check the server logs for errors.", pt: "Verifique os registos do servidor para erros." },
                    { en: "The connection is unstable.", pt: "A conexão está instável." },
                    { en: "We need to troubleshoot this issue.", pt: "Precisamos resolver este problema." },
                    { en: "Can you restart the system?", pt: "Podes reiniciar o sistema?" },
                    { en: "What is the current status?", pt: "Qual é o estado actual?" },
                    { en: "Enable the security protocol.", pt: "Ativa o protocolo de segurança." },
                    { en: "Save the file before closing.", pt: "Guarda o ficheiro antes de fechar." }
                ]
            },
            hard: {
                vocab: [
                    { en: "throughput", pt: "débito" },
                    { en: "topology", pt: "topologia" },
                    { en: "redundancy", pt: "redundância" },
                    { en: "virtualization", pt: "virtualização" },
                    { en: "scalability", pt: "escalabilidade" },
                    { en: "interoperability", pt: "interoperabilidade" },
                    { en: "compliance", pt: "conformidade" },
                    { en: "infrastructure", pt: "infraestrutura" }
                ],
                phrases: [
                    { en: "Implement a robust security infrastructure.", pt: "Implementa uma infraestrutura de segurança robusta." },
                    { en: "Network topology requires careful planning.", pt: "A topologia de rede requer planeamento cuidadoso." },
                    { en: "Database optimization improves performance significantly.", pt: "A otimização do banco de dados melhora o desempenho significativamente." },
                    { en: "Virtualization reduces infrastructure costs.", pt: "A virtualização reduz os custos de infraestrutura." },
                    { en: "Ensure system scalability for future growth.", pt: "Garante a escalabilidade do sistema para crescimento futuro." }
                ]
            }
        };

        // ===== ESTADO DO JOGO =====
        let gameState = {
            timeRemaining: 30 * 60,
            currentExercise: 0,
            correct: 0,
            incorrect: 0,
            points: 0,
            exercises: [],
            answered: false,
            sessionActive: true,
            difficulty: 'easy',
            consecutiveCorrect: 0,
            streak: parseInt(localStorage.getItem('streak') || '0'),
            lastSessionDate: localStorage.getItem('lastSessionDate') || null
        };

        // ===== ÁUDIO =====
        function playAudio(text, lang = 'en-US') {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }

        function addAudioButton(text, lang = 'en-US') {
            const escaped = text.replace(/'/g, "\\'").replace(/"/g, '\\"');
            return `<button class="audio-btn" onclick="playAudioAndAnimate(this, '${escaped}', '${lang}')" title="Ouve a pronúncia" type="button" data-text="${text}">
                <i class="fas fa-volume-up"></i>
            </button>`;
        }

        function playAudioAndAnimate(btn, text, lang) {
            btn.classList.add('playing');
            playAudio(text, lang);
            setTimeout(() => btn.classList.remove('playing'), 600);
        }

        // ===== PERSISTÊNCIA E STREAK =====
        function updateStreak() {
            const today = new Date().toDateString();
            const lastDate = gameState.lastSessionDate;

            if (lastDate !== today) {
                if (lastDate) {
                    const last = new Date(lastDate);
                    const now = new Date();
                    const daysDiff = Math.floor((now - last) / (1000 * 60 * 60 * 24));

                    if (daysDiff === 1) {
                        gameState.streak++;
                    } else if (daysDiff > 1) {
                        gameState.streak = 1;
                    }
                } else {
                    gameState.streak = 1;
                }

                localStorage.setItem('streak', gameState.streak);
                localStorage.setItem('lastSessionDate', today);
            }
        }

        // ===== DIFICULDADE PROGRESSIVA =====
        function getDifficultyData() {
            return vocabularyData[gameState.difficulty];
        }

        function updateDifficulty() {
            gameState.consecutiveCorrect++;

            if (gameState.consecutiveCorrect >= 5 && gameState.difficulty === 'easy') {
                gameState.difficulty = 'medium';
                gameState.consecutiveCorrect = 0;
                updateDifficultyUI();
                regenerateRemainingExercises();
            } else if (gameState.consecutiveCorrect >= 8 && gameState.difficulty === 'medium') {
                gameState.difficulty = 'hard';
                gameState.consecutiveCorrect = 0;
                updateDifficultyUI();
                regenerateRemainingExercises();
            }
        }

        function updateDifficultyUI() {
            const label = document.getElementById('difficultyLabel');
            const d1 = document.getElementById('d1');
            const d2 = document.getElementById('d2');
            const d3 = document.getElementById('d3');

            label.textContent = gameState.difficulty === 'easy' ? 'Fácil' : gameState.difficulty === 'medium' ? 'Médio' : 'Difícil';

            d1.classList.toggle('active', gameState.difficulty !== 'easy');
            d2.classList.toggle('active', gameState.difficulty === 'medium' || gameState.difficulty === 'hard');
            d3.classList.toggle('active', gameState.difficulty === 'hard');
        }

        // ===== GERAÇÃO DE EXERCÍCIOS =====
        function generateOptions(correct, pool) {
            const options = [correct];
            const available = pool.filter(item => item !== correct);

            while (options.length < 4 && available.length > 0) {
                const random = available[Math.floor(Math.random() * available.length)];
                if (!options.includes(random)) {
                    options.push(random);
                }
            }

            if (options.length < 4) {
                options.push(...['palavra', 'termo', 'conceito', 'definição'].slice(0, 4 - options.length));
            }

            return options.sort(() => Math.random() - 0.5);
        }

        function generateExercises() {
            const types = ['vocab-multiple', 'phrase-translate', 'vocab-input', 'phrase-fill'];
            gameState.exercises = [];
            const usedVocab = new Set();

            for (let i = 0; i < 20; i++) {
                const type = types[i % types.length];
                const diffData = getDifficultyData();

                try {
                    if (type === 'vocab-multiple') {
                        const vocabPool = diffData.vocab.filter(v => !usedVocab.has(v.en));
                        if (vocabPool.length === 0) break;

                        const vocab = vocabPool[Math.floor(Math.random() * vocabPool.length)];
                        usedVocab.add(vocab.en);

                        const allPt = vocabularyData.easy.vocab.concat(vocabularyData.medium.vocab, vocabularyData.hard.vocab).map(v => v.pt);
                        gameState.exercises.push({
                            type: 'vocab-multiple',
                            vocab: vocab,
                            options: generateOptions(vocab.pt, allPt)
                        });
                    } else if (type === 'phrase-translate') {
                        const phrase = diffData.phrases[Math.floor(Math.random() * diffData.phrases.length)];
                        const allPt = vocabularyData.easy.phrases.concat(vocabularyData.medium.phrases, vocabularyData.hard.phrases).map(p => p.pt);
                        gameState.exercises.push({
                            type: 'phrase-translate',
                            phrase: phrase,
                            options: generateOptions(phrase.pt, allPt)
                        });
                    } else if (type === 'vocab-input') {
                        const vocabPool = diffData.vocab.filter(v => !usedVocab.has(v.en));
                        if (vocabPool.length === 0) continue;

                        const vocab = vocabPool[Math.floor(Math.random() * vocabPool.length)];
                        usedVocab.add(vocab.en);
                        gameState.exercises.push({
                            type: 'vocab-input',
                            vocab: vocab
                        });
                    } else if (type === 'phrase-fill') {
                        const phrase = diffData.phrases[Math.floor(Math.random() * diffData.phrases.length)];
                        const words = phrase.en.split(' ');
                        const gapIndex = Math.floor(Math.random() * words.length);
                        gameState.exercises.push({
                            type: 'phrase-fill',
                            phrase: phrase,
                            gapIndex: gapIndex,
                            gapWord: words[gapIndex]
                        });
                    }
                } catch (e) {
                    console.error('Erro gerando exercício:', e);
                }
            }
        }

        function regenerateRemainingExercises() {
            const remaining = gameState.exercises.length - gameState.currentExercise - 1;
            gameState.exercises = gameState.exercises.slice(0, gameState.currentExercise + 1);

            for (let i = 0; i < remaining; i++) {
                const types = ['vocab-multiple', 'phrase-translate', 'vocab-input', 'phrase-fill'];
                const type = types[i % types.length];
                const diffData = getDifficultyData();

                try {
                    if (type === 'vocab-multiple') {
                        const vocab = diffData.vocab[Math.floor(Math.random() * diffData.vocab.length)];
                        const allPt = vocabularyData.easy.vocab.concat(vocabularyData.medium.vocab, vocabularyData.hard.vocab).map(v => v.pt);
                        gameState.exercises.push({
                            type: 'vocab-multiple',
                            vocab: vocab,
                            options: generateOptions(vocab.pt, allPt)
                        });
                    } else if (type === 'phrase-translate') {
                        const phrase = diffData.phrases[Math.floor(Math.random() * diffData.phrases.length)];
                        const allPt = vocabularyData.easy.phrases.concat(vocabularyData.medium.phrases, vocabularyData.hard.phrases).map(p => p.pt);
                        gameState.exercises.push({
                            type: 'phrase-translate',
                            phrase: phrase,
                            options: generateOptions(phrase.pt, allPt)
                        });
                    } else if (type === 'vocab-input') {
                        const vocab = diffData.vocab[Math.floor(Math.random() * diffData.vocab.length)];
                        gameState.exercises.push({
                            type: 'vocab-input',
                            vocab: vocab
                        });
                    } else if (type === 'phrase-fill') {
                        const phrase = diffData.phrases[Math.floor(Math.random() * diffData.phrases.length)];
                        const words = phrase.en.split(' ');
                        const gapIndex = Math.floor(Math.random() * words.length);
                        gameState.exercises.push({
                            type: 'phrase-fill',
                            phrase: phrase,
                            gapIndex: gapIndex,
                            gapWord: words[gapIndex]
                        });
                    }
                } catch (e) {
                    console.error('Erro gerando exercício:', e);
                }
            }
        }

        // ===== CARREGAMENTO E EXIBIÇÃO DE EXERCÍCIOS =====
        function loadExercise() {
            if (gameState.currentExercise >= gameState.exercises.length) {
                endSession();
                return;
            }

            const ex = gameState.exercises[gameState.currentExercise];
            gameState.answered = false;

            document.getElementById('exerciseCount').textContent =
                `Ex. ${gameState.currentExercise + 1}/${gameState.exercises.length}`;

            let html = '';

            if (ex.type === 'vocab-multiple') {
                html = `
                    <div class="exercise-box">
                        <div class="exercise-header">
                            <span class="exercise-badge">Tradução</span>
                            <span class="exercise-title">Qual é a tradução?</span>
                            ${addAudioButton(ex.vocab.en)}
                        </div>
                        <div class="question-text">"${escapeHtml(ex.vocab.en)}"</div>
                        <div class="options" id="optionsContainer">
                            ${ex.options.map((opt, i) => `
                                <button class="option-btn" onclick="selectAnswer(this, ${i}, '${escapeHtml(opt)}', '${escapeHtml(ex.vocab.pt)}')" type="button">
                                    ${escapeHtml(opt)}
                                </button>
                            `).join('')}
                        </div>
                        <div class="feedback" id="feedback"></div>
                    </div>
                `;
            } else if (ex.type === 'phrase-translate') {
                html = `
                    <div class="exercise-box">
                        <div class="exercise-header">
                            <span class="exercise-badge">Frase</span>
                            <span class="exercise-title">Traduz para português</span>
                            ${addAudioButton(ex.phrase.en)}
                        </div>
                        <div class="question-text">"${escapeHtml(ex.phrase.en)}"</div>
                        <div class="options" id="optionsContainer">
                            ${ex.options.map((opt, i) => `
                                <button class="option-btn" onclick="selectAnswer(this, ${i}, '${escapeHtml(opt)}', '${escapeHtml(ex.phrase.pt)}')" type="button">
                                    ${escapeHtml(opt)}
                                </button>
                            `).join('')}
                        </div>
                        <div class="feedback" id="feedback"></div>
                    </div>
                `;
            } else if (ex.type === 'vocab-input') {
                html = `
                    <div class="exercise-box">
                        <div class="exercise-header">
                            <span class="exercise-badge">Escrita</span>
                            <span class="exercise-title">Escreve a tradução</span>
                            ${addAudioButton(ex.vocab.en)}
                        </div>
                        <div class="question-text">"${escapeHtml(ex.vocab.en)}"</div>
                        <input type="text" class="input-field" id="userInput" placeholder="Digite a tradução..." autocomplete="off">
                        <div class="feedback" id="feedback"></div>
                        <div class="error-message" id="errorMessage">Por favor, escreve uma resposta</div>
                        <button class="btn btn-primary" onclick="checkInput('${escapeHtml(ex.vocab.pt)}')" type="button">Verificar</button>
                    </div>
                `;
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            } else if (ex.type === 'phrase-fill') {
                const words = ex.phrase.en.split(' ');
                const sentence = words.map((w, i) => i === ex.gapIndex ? '______' : w).join(' ');
                html = `
                    <div class="exercise-box">
                        <div class="exercise-header">
                            <span class="exercise-badge">Preenchimento</span>
                            <span class="exercise-title">Completa a frase</span>
                            ${addAudioButton(ex.phrase.en)}
                        </div>
                        <div class="question-text">"${escapeHtml(sentence)}"</div>
                        <input type="text" class="input-field" id="userInput" placeholder="Digite a palavra..." autocomplete="off">
                        <div class="feedback" id="feedback"></div>
                        <div class="error-message" id="errorMessage">Por favor, escreve uma resposta</div>
                        <button class="btn btn-primary" onclick="checkInput('${escapeHtml(ex.gapWord)}')" type="button">Verificar</button>
                    </div>
                `;
                setTimeout(() => document.getElementById('userInput').focus(), 100);
            }

            html += `
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="skipExercise()" type="button">Saltar</button>
                </div>
            `;

            document.getElementById('exerciseContent').innerHTML = html;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ===== VERIFICAÇÃO DE RESPOSTAS =====
        function selectAnswer(btn, index, selected, correct) {
            if (gameState.answered) return;
            gameState.answered = true;

            disableAllOptions();

            const buttons = document.querySelectorAll('.option-btn');
            let correctBtn = null;

            buttons.forEach((b) => {
                if (b.textContent.trim() === correct.trim()) {
                    b.classList.add('correct');
                    correctBtn = b;
                }
            });

            const feedback = document.getElementById('feedback');
            if (selected.trim() === correct.trim()) {
                gameState.correct++;
                gameState.points += 10;
                feedback.classList.add('success', 'show');
                feedback.textContent = '✓ Correto! +10 pontos';
                updateDifficulty();
            } else {
                gameState.incorrect++;
                gameState.consecutiveCorrect = 0;
                btn.classList.add('incorrect');
                feedback.classList.add('error', 'show');
                feedback.textContent = `✗ Errado. A resposta é: ${correct}`;
            }

            updateStats();
            setTimeout(nextExercise, 2000);
        }

        function checkInput(correct) {
            if (gameState.answered) return;

            const userInput = document.getElementById('userInput').value.trim();

            if (!userInput) {
                document.getElementById('errorMessage').classList.add('show');
                return;
            }

            gameState.answered = true;
            document.getElementById('userInput').disabled = true;

            const userNorm = normalizeInput(userInput);
            const correctNorm = normalizeInput(correct);

            const feedback = document.getElementById('feedback');
            if (userNorm === correctNorm || fuzzyMatch(userNorm, correctNorm)) {
                gameState.correct++;
                gameState.points += 10;
                feedback.classList.add('success', 'show');
                feedback.textContent = '✓ Correto! +10 pontos';
                updateDifficulty();
            } else {
                gameState.incorrect++;
                gameState.consecutiveCorrect = 0;
                feedback.classList.add('error', 'show');
                feedback.textContent = `✗ Errado. A resposta é: ${correct}`;
            }

            updateStats();
            setTimeout(nextExercise, 2000);
        }

        function normalizeInput(text) {
            return text.toLowerCase().trim().replace(/\s+/g, ' ').split('/')[0];
        }

        function fuzzyMatch(input, correct) {
            if (input === correct) return true;
            if (input.includes(correct) || correct.includes(input)) return true;

            const words1 = input.split(' ');
            const words2 = correct.split(' ');

            if (words1.length > 1 && words2.length > 1) {
                const match = words1.filter(w => words2.includes(w)).length / Math.max(words1.length, words2.length);
                return match > 0.7;
            }

            return false;
        }

        function disableAllOptions() {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
        }

        function skipExercise() {
            nextExercise();
        }

        function nextExercise() {
            gameState.currentExercise++;
            loadExercise();
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = gameState.correct;
            document.getElementById('incorrectCount').textContent = gameState.incorrect;
            document.getElementById('pointsCount').textContent = gameState.points;

            const total = gameState.correct + gameState.incorrect;
            const accuracy = total > 0 ? Math.round((gameState.correct / total) * 100) : 0;
            document.getElementById('accuracyCount').textContent = accuracy + '%';
        }

        // ===== TIMER =====
        function startTimer() {
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                if (!gameState.sessionActive) {
                    clearInterval(interval);
                    return;
                }

                gameState.timeRemaining--;

                const mins = Math.floor(gameState.timeRemaining / 60);
                const secs = gameState.timeRemaining % 60;
                timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

                if (gameState.timeRemaining <= 300) {
                    timerEl.classList.add('warning');
                }

                if (gameState.timeRemaining <= 0) {
                    endSession();
                    clearInterval(interval);
                }
            }, 1000);
        }

        // ===== FIM DA SESSÃO =====
        function endSession() {
            gameState.sessionActive = false;
            updateStreak();

            document.getElementById('sessionEndContainer').style.display = 'block';
            document.getElementById('exerciseContent').style.display = 'none';

            const total = gameState.correct + gameState.incorrect;
            const accuracy = total > 0 ? Math.round((gameState.correct / total) * 100) : 0;

            document.getElementById('finalBadge').textContent = `+${gameState.points} pontos`;
            document.getElementById('finalStats').textContent = `${gameState.correct} corretas, ${gameState.incorrect} erradas • Acurácia: ${accuracy}%`;

            const streakBar = document.getElementById('streakBar');
            for (let i = 0; i < Math.min(gameState.streak, 7); i++) {
                const dot = document.createElement('div');
                dot.className = 'streak-dot active';
                streakBar.appendChild(dot);
            }
        }

        // ===== INICIALIZAÇÃO =====
        function initSession() {
            generateExercises();
            updateDifficultyUI();
            startTimer();
            loadExercise();
        }

        initSession();
    </script>
